name: Fix index.html pointer line

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghpages-dir
          fetch-depth: 0
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-dir
          fetch-depth: 0
      - name: Fix pointer line and sync both branches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('ghpages-dir/index.html')
          s = p.read_text(encoding='utf-8')
          old = "  const target = now - SP.pointerAt < 4000 && SP.pointer ? SP.pointer\n    : gaze || [Math.sin(now / 2300) * .25, Math.sin(now / 3100) * .15];"
          new = "  const target = gaze || [Math.sin(now / 2300) * .25, Math.sin(now / 3100) * .15];"
          assert s.count(old) == 1, 'old target line not found exactly once'
          assert 'share:front' in s, 'share:front missing in gh-pages index.html'
          s2 = s.replace(old, new)
          assert 'now - SP.pointerAt < 4000' not in s2
          assert s2.count(new) == 1
          assert 'share:front' in s2
          p.write_text(s2, encoding='utf-8')
          print('fixed gh-pages index.html')
          PY
          cd ghpages-dir
          git add -A
          git status --short
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove mouse-pointer following from index.html (keep share:front OG meta)'
          git push origin gh-pages
          cd ../main-dir
          cp ../ghpages-dir/index.html index.html
          rm -f .github/workflows/fix-index.yml
          git add -A
          git status --short
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore share:front OG meta in index.html (keep pointer-following removal)'
          git push origin main
